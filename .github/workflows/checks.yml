name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install host test tools
        run: sudo apt-get update && sudo apt-get install -y python3-pil build-essential patch xz-utils device-tree-compiler
      - name: Check public files
        run: python3 scripts/check-publication.py
      - name: Prepare pinned kernel source
        run: python3 scripts/prepare-lte-kernel.py
      - name: Run host regression tests
        run: python3 -m unittest discover -s tests
      - name: Render dashboard previews
        run: python3 tools/dashboard-preview
