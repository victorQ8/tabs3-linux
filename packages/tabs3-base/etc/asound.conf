# Galaxy Tab S3 LTE speakers for the mounted landscape orientation (Home key
# on the right). The four amplifiers on the TDM back end are, in slot order,
# LL, LR, UL, UR as named for portrait with the Home key at the bottom; in
# landscape the "upper" pair UL/UR is on the left of the screen and the
# "lower" pair LL/LR on the right (checked by ear, 2026-10-14). A stereo
# stream therefore goes left -> UL and UR, right -> LL and LR.
pcm.speakers_route {
    type route
    slave {
        pcm "hw:0,0"
        channels 4
    }
    ttable.0.2 1
    ttable.0.3 1
    ttable.1.0 1
    ttable.1.1 1
}
pcm.speakers {
    type plug
    slave.pcm "speakers_route"
    hint.description "Four speakers, stereo for the landscape mount"
}
pcm.!default {
    type plug
    slave.pcm "speakers_route"
}
