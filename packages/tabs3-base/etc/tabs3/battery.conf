# tabs3-battery-keeper: the charge window for a tablet that lives on the
# charger. Above TABS3_BATTERY_HIGH percent charging is inhibited (the tablet
# runs from the charger, the cell rests); three points or more above it (a
# full battery) the tablet runs from its battery, although plugged in, down
# to the high mark; below TABS3_BATTERY_LOW charging resumes. Set both to 100
# to charge fully, for example before a planned power cut.
TABS3_BATTERY_HIGH=80
TABS3_BATTERY_LOW=65
