# SM-T825: never write the modem's EFS partitions (IMEI, RF calibration).
# rmtfs -r serves them from RAM copies and keeps every modem write there;
# also make the partitions read-only at the block layer first. -s starts the
# modem once its file system is being served.
[Service]
ExecStartPre=/usr/sbin/blockdev --setro /dev/disk/by-partlabel/modemst1 /dev/disk/by-partlabel/modemst2 /dev/disk/by-partlabel/fsg /dev/disk/by-partlabel/fsc
ExecStart=
ExecStart=/usr/bin/rmtfs -r -P -s
