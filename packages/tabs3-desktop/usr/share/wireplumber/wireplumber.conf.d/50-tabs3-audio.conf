# SM-T825 (Samsung MSM8996 ADSP firmware):
# - Open all of this card's PCMs as 16-bit. The DSP rejects 24-bit capture
#   streams (ASM_STREAM_CMD_OPEN_READ_V3), and 24-bit (S24_LE) playback runs
#   but comes out inaudible on the speakers, while the same tone in S16_LE
#   plays (owner's listening test, 2026-10-13).
# - q6asm-dai only advances its position once per period, which PipeWire's
#   timer-based scheduling mistakes for xruns; schedule on period interrupts.
# - The speakers are one 4-channel sink (UCM "Speaker", PCM 0): bottom-left,
#   bottom-right, top-left, top-right in portrait. As FL FR RL RR with the
#   simple upmix, stereo plays on both speakers of each side.
monitor.alsa.rules = [
  {
    matches = [
      {
        api.alsa.path = "~hw:SMT825,.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.disable-tsched = true
        audio.format = "S16LE"
      }
    }
  }
  {
    matches = [
      {
        media.class = "Audio/Sink"
        api.alsa.path = "hw:SMT825,0"
      }
    ]
    actions = {
      update-props = {
        audio.channels = 4
        audio.position = [ FL FR RL RR ]
        channelmix.upmix = true
        channelmix.upmix-method = "simple"
      }
    }
  }
]
