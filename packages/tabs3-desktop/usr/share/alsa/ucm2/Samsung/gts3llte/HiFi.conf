# Samsung Galaxy Tab S3 LTE (SM-T825): four speakers (RT5508 amplifiers on
# primary TDM), WCD9335 headphones and analog mics, based on the APQ8096
# DB820c profile. WCD9335 has no jack detection in mainline, so Headphones
# and the headset mic are always offered; Speaker has the higher priority.
#
# The DSP routes of the three front ends are set with the verb: a front end
# without a route cannot be opened, and PipeWire opens every PCM of the verb
# before it enables any device.

SectionVerb {
	EnableSequence [
		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIM RX1 MUX' ZERO"
		cset "name='SLIM RX2 MUX' ZERO"
		cset "name='SLIM RX3 MUX' ZERO"
		cset "name='SLIM RX4 MUX' ZERO"
		cset "name='SLIM RX7 MUX' ZERO"
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='SLIMBUS_6_RX Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer SLIMBUS_0_TX' 1"
	]

	DisableSequence [
		cset "name='MultiMedia3 Mixer SLIMBUS_0_TX' 0"
		cset "name='SLIMBUS_6_RX Audio Mixer MultiMedia2' 0"
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

# The four channels feed the amplifiers in slot order: bottom-left (LL),
# bottom-right (LR), top-left (UL) and top-right (UR) in portrait with the
# Home key at the bottom. WirePlumber names them FL FR RL RR, so stereo
# plays left on both left speakers and right on both right ones.
SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		## -10 dB amplifier ceiling (255 = 0 dB): the speakers have no
		## protection algorithm; PipeWire scales below it
		cset "name='Speaker LL DAC Volume' 235"
		cset "name='Speaker LR DAC Volume' 235"
		cset "name='Speaker UL DAC Volume' 235"
		cset "name='Speaker UR DAC Volume' 235"
	]

	DisableSequence [
		cset "name='Speaker LL DAC Volume' 175"
		cset "name='Speaker LR DAC Volume' 175"
		cset "name='Speaker UL DAC Volume' 175"
		cset "name='Speaker UR DAC Volume' 175"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 4
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='SLIM RX5 MUX' AIF4_PB"
		cset "name='SLIM RX6 MUX' AIF4_PB"
		cset "name='RX INT1_2 MUX' RX5"
		cset "name='RX INT2_2 MUX' RX6"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT2 DEM MUX' CLSH_DSM_OUT"
		## -12 dB digital ceiling (84 = 0 dB); PipeWire scales below it
		cset "name='RX5 Digital Volume' 72"
		cset "name='RX6 Digital Volume' 72"
	]

	DisableSequence [
		cset "name='RX5 Digital Volume' 0"
		cset "name='RX6 Digital Volume' 0"
		cset "name='SLIM RX5 MUX' ZERO"
		cset "name='SLIM RX6 MUX' ZERO"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	ConflictingDevice [
		"Headset"
	]

	EnableSequence [
		cset "name='ADC MUX0' AMIC"
		cset "name='AMIC MUX0' ADC3"
		cset "name='ADC3 Volume' 12"
		cset "name='SLIM TX0 MUX' DEC0"
		cset "name='AIF1_CAP Mixer SLIM TX0' 1"
	]

	DisableSequence [
		cset "name='AIF1_CAP Mixer SLIM TX0' 0"
		cset "name='SLIM TX0 MUX' ZERO"
		cset "name='AMIC MUX0' ZERO"
		cset "name='ADC3 Volume' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 1
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	ConflictingDevice [
		"Mic"
	]

	EnableSequence [
		cset "name='ADC MUX0' AMIC"
		cset "name='AMIC MUX0' ADC2"
		cset "name='ADC2 Volume' 12"
		cset "name='SLIM TX0 MUX' DEC0"
		cset "name='AIF1_CAP Mixer SLIM TX0' 1"
	]

	DisableSequence [
		cset "name='AIF1_CAP Mixer SLIM TX0' 0"
		cset "name='SLIM TX0 MUX' ZERO"
		cset "name='AMIC MUX0' ZERO"
		cset "name='ADC2 Volume' 0"
	]

	Value {
		CapturePriority 50
		CapturePCM "hw:${CardId},2"
		CaptureChannels 1
	}
}
