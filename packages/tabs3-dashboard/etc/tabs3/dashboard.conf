# tabs3-dashboard settings (restart tabs3-dashboard.service after a change)

# Layout: original (the original instrument panel), observatory (green
# gauges and telemetry), folio (warm, spacious typography), terminal
# (a dense, btop-inspired monitor), or silicon (realistic components with
# live readings on a true-black circuit board). All work with FONT_SET below.
THEME=original

# Seconds between frames while the screen is on.
REFRESH=2

# Presence wake while the screen is off: a sudden change of the light at
# the sensor (a shadow, a light switched on) asks tabs3-screen to wake the
# screen, as a touch would. The tablet lives on a mount, so the
# accelerometer is off by default; for a tablet lying on a desk,
# WAKE_ON_MOTION=1 makes a hand on the desk or picking it up wake it.
WAKE_ON_LIGHT=1
LIGHT_CHANGE_PERCENT=35
LIGHT_CHANGE_LUX=3
WAKE_ON_MOTION=0
MOTION_THRESHOLD=0.25
# A sound at the microphone (footsteps, a voice) at least SOUND_RISE_DB above
# the quietest 100 ms of the last half minute, and at least SOUND_MIN_DBFS
# loud, wakes the screen. The capture on SOUND_DEVICE (the analog mic through
# the audio DSP) stays open once the screen first went off.
WAKE_ON_SOUND=1
SOUND_RISE_DB=15
SOUND_MIN_DBFS=-50
SOUND_DEVICE=hw:0,2
# The front camera, which faces the room, watches for motion while the
# screen is off: a VGA frame every CAMERA_INTERVAL seconds (the camera is
# powered only for the frame, and frames stay in memory), compared with the
# previous one on a coarse grid; a change of CAMERA_CHANGE_PERCENT of the
# picture's brightness wakes the screen (a still room measures 0.2 to
# 0.3 %). In the dark it samples four times
# slower and sees nobody; the light and sound wakes still work.
WAKE_ON_CAMERA=1
CAMERA_INTERVAL=4
CAMERA_CHANGE_PERCENT=3.5
# Seconds between two presence wakes, and seconds to ignore the sensors
# right after the screen goes off (the panel's own light is a change too).
WAKE_HOLDOFF=15
SETTLE_AFTER_OFF=6

# The picture moves by a few pixels this often, so the AMOLED does not keep
# a ghost of the layout.
PIXEL_SHIFT_SECONDS=180

# Typefaces: b612 (Airbus's cockpit display face, fonts-b612), inter
# (fonts-inter + fonts-jetbrains-mono), manrope (fonts-manrope +
# fonts-cascadia-code), sora (fonts-sora + fonts-hack), sourcesans
# (fonts-adobe-sourcesans3 + fonts-jetbrains-mono) or atkinson
# (fonts-atkinson-hyperlegible + fonts-hack). Missing fonts fall back to
# DejaVu.
FONT_SET=b612
